[workspace]
resolver = "2"
members = [
    "crates/blackbox-types",
    "crates/blackbox",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Shared types
blackbox-types = { path = "crates/blackbox-types" }

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Time
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Memory-mapped I/O
memmap2 = "0.9"

# Lock-free data structures
crossbeam = "0.8"

# Fast mutex
parking_lot = "0.12"

# Hashing
sha2 = "0.10"
crc32fast = "1.3"

# Compression
zstd = "0.13"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Testing
criterion = "0.5"
tempfile = "3.10"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
lto = true
codegen-units = 1
