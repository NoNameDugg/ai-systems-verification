# =============================================================================
# Flash - Docker Container Configuration
# =============================================================================
#
# This configuration is optimized for Docker container deployment.
# Key differences from development config:
# - Redis URL uses container network (redis:6379)
# - OANDA credentials from environment variables
# - Production logging level
#
# Environment Variables Required:
# - OANDA_API_TOKEN: Your OANDA API token
# - OANDA_ACCOUNT_ID: Your OANDA account ID
#
# =============================================================================

# Shadow mode (controlled by ASTRA_FLASH_SHADOW_MODE_ENABLED env var)
shadow_mode:
  enabled: false
  namespace: "rust"

# WebSocket settings (production-optimized)
websocket:
  connect_timeout_ms: 5000
  read_timeout_ms: 5000
  ping_interval_ms: 30000
  pong_timeout_ms: 10000
  max_reconnect_attempts: 100
  reconnect_delay_ms: 1000
  max_reconnect_delay_ms: 30000
  reconnect_jitter: 0.1

# Order book settings
orderbook:
  max_depth: 50
  max_levels: 100
  track_orders: false
  auto_prune: true
  gap_handling: snapshot

# Redis configuration (Docker network)
redis:
  url: "redis://redis:6379"
  database: 0
  pool_size: 10
  connect_timeout_ms: 5000
  command_timeout_ms: 1000
  batch_size: 100
  batch_timeout_ms: 10
  health_check_interval_ms: 5000

# Publisher settings
publisher:
  format: json
  debug_json_fallback: false
  topic_prefix: "astra:signals:flash"
  backpressure:
    capacity: 10000
    warn_threshold: 0.75
    critical_threshold: 0.95
    action: drop_oldest

# =============================================================================
# EXCHANGE CONFIGURATIONS
# =============================================================================

exchanges:
  # Deribit (disabled in container)
  deribit:
    enabled: false
    ws_url: "wss://www.deribit.com/ws/api/v2"
    rate_limit_per_second: 20
    instruments: []

  # Binance (disabled in container)
  binance:
    enabled: false
    ws_url: "wss://stream.binance.com:9443/ws"
    rate_limit_per_second: 20
    instruments: []

  # OANDA (ENABLED - LIVE Production Account)
  # CRITICAL: Using LIVE credentials - real money trading!
  oanda:
    enabled: true
    ws_url: "https://stream-fxtrade.oanda.com/v3/accounts"  # LIVE URL
    api_key: ""
    account_id: ""
    rate_limit_per_second: 100
    instruments:
      - EUR_USD
      - GBP_USD
      - USD_JPY
      - USD_CHF
      - AUD_USD
      - NZD_USD
      - USD_CAD

# Logging - Container stdout
logging:
  level: info
  format: json
  file_path: null
  max_file_size_mb: 100
  max_files: 5

# Metrics (Prometheus)
metrics:
  enabled: true
  port: 9090
  bind_address: "0.0.0.0"
  path: "/metrics"
