# =============================================================================
# PROFILES - Build Optimization
# =============================================================================

[profile.release]
lto = "thin"           # Link-time optimization (faster builds than "fat")
codegen-units = 1      # Better optimization
panic = "abort"        # Smaller binary, faster runtime
strip = true           # Strip debug symbols

[profile.bench]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true

# Development with some optimization (for faster dev testing)
[profile.dev.package."*"]
opt-level = 2

# =============================================================================
# FEATURES
# =============================================================================

[features]
default = []

# Enable SIMD-accelerated JSON parsing
simd = []

# Enable Python bindings
python = ["pyo3", "portable-atomic"]

# Enable flight-recorder recording
# When enabled, the tap points record events to the sibling blackbox
# flight-recorder for deterministic replay/debugging. Off by default so the core
# build stays standalone (no cross-component dependency unless opted in).
blackbox = ["dep:flight-recorder"]

# Enable all features
full = ["simd", "python"]

# =============================================================================
# WORKSPACE (if needed later)
# =============================================================================

# [workspace]
# members = []

# =============================================================================
# LINTS
# =============================================================================

[lints.rust]
# Deny common issues
unsafe_code = "deny"
missing_docs = "warn"  # Will be "deny" after initial development

[lints.clippy]
# Clippy configuration - lint groups have lower priority so individual lints can override
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow specific lints that are too strict for this project
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
similar_names = "allow"               # total_pings/total_pongs is clear enough
doc_markdown = "allow"                # PyO3, OANDA, etc. don't need backticks
missing_panics_doc = "allow"          # Panics on lock poison are documented implicitly
cast_precision_loss = "allow"         # u64->f64 for metrics/stats is acceptable
cast_possible_truncation = "allow"    # Explicit truncation in market data context
cast_sign_loss = "allow"              # Explicit in financial calculations
unused_self = "allow"                 # Methods may use self in future implementations
significant_drop_tightening = "allow" # Lock scoping is explicit and correct
significant_drop_in_scrutinee = "allow"
missing_const_for_fn = "allow"        # Const fn not always beneficial
unnecessary_wraps = "allow"           # Result wrapping for API consistency
option_if_let_else = "allow"          # Readability preference
match_same_arms = "allow"             # Explicit matching for documentation
if_same_then_else = "allow"           # Explicit branches for future differentiation
trivially_copy_pass_by_ref = "allow"  # Consistency in APIs
# pass_by_value removed - invalid lint name
unreadable_literal = "allow"          # 120000 is clear in timeout context
missing_fields_in_debug = "allow"     # Intentional exclusion of mutex/large fields
needless_pass_by_value = "allow"      # API consistency for future use
only_used_in_recursion = "allow"      # Recursive methods correctly use self
self_only_used_in_recursion = "allow" # Recursive methods correctly use self
branches_sharing_code = "allow"       # Explicit branches for clarity
return_self_not_must_use = "allow"    # Builder pattern doesn't always need #[must_use]
manual_let_else = "allow"             # Match style preference for readability
items_after_statements = "allow"      # Const placement preference
cast_possible_wrap = "allow"          # Explicit in controlled contexts
comparison_chain = "allow"            # if-else chains clearer than match in some cases
