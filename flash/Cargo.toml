# =============================================================================
# Flash - Cargo Configuration
# =============================================================================
# High-Frequency Market Data Adapter
# Language: Rust (Core Engine) + Python (PyO3 Bindings)
# =============================================================================

[package]
name = "astra_flash"
version = "0.1.0"
edition = "2021"
authors = ["Jared Temple"]
description = "High-Frequency Market Data Adapter (Rust + PyO3)"
license = "MIT"
rust-version = "1.75"
readme = "README.md"
keywords = ["trading", "market-data", "hft", "orderbook", "websocket"]
categories = ["finance", "network-programming", "asynchronous"]

[lib]
name = "astra_flash"
crate-type = ["cdylib", "rlib"]  # cdylib for PyO3, rlib for Rust usage

[[bin]]
name = "astra-flash"
path = "src/main.rs"

# =============================================================================
# DEPENDENCIES - Organized by Category
# =============================================================================

[dependencies]
# -----------------------------------------------------------------------------
# Async Runtime (Tokio)
# -----------------------------------------------------------------------------
tokio = { version = "1.35", features = [
    "full",
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "signal"
] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
reqwest = { version = "0.11", features = ["stream", "native-tls"] }  # HTTP streaming for OANDA
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"

# -----------------------------------------------------------------------------
# Serialization - Zero-Copy Focus (binary formats for HFT)
# -----------------------------------------------------------------------------
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-json = "0.13"  # SIMD-accelerated JSON parsing
bincode = "1.3"      # Binary serialization (much faster than JSON)
rkyv = { version = "0.7", features = ["validation"] }  # Zero-copy deserialization

# -----------------------------------------------------------------------------
# Redis - Connection Pooling & Streams
# -----------------------------------------------------------------------------
redis = { version = "0.24", features = [
    "tokio-comp",
    "streams",
    "connection-manager"
] }
deadpool-redis = "0.14"

# -----------------------------------------------------------------------------
# Data Structures - Lock-Free & High Performance
# -----------------------------------------------------------------------------
dashmap = "5.5"              # Concurrent HashMap
crossbeam = "0.8"            # Lock-free data structures
crossbeam-channel = "0.5"    # MPMC channels
parking_lot = "0.12"         # Faster mutexes

# -----------------------------------------------------------------------------
# Order Book Specific - Numeric Precision
# -----------------------------------------------------------------------------
ordered-float = "4.2"        # Float ordering for BTreeMap keys
rust_decimal = "1.33"        # Precise decimal arithmetic

# -----------------------------------------------------------------------------
# Python Bindings - PyO3
# -----------------------------------------------------------------------------
pyo3 = { version = "0.23", features = [
    "extension-module",
    "abi3-py38"
], optional = true }

# Pin portable-atomic to avoid unstable feature issues with PyO3 dependencies
portable-atomic = { version = "1.10", optional = true }

# -----------------------------------------------------------------------------
# Error Handling - thiserror + anyhow
# -----------------------------------------------------------------------------
thiserror = "1.0"
anyhow = "1.0"

# -----------------------------------------------------------------------------
# Logging & Metrics - Structured Logging with Prometheus
# -----------------------------------------------------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
    "fmt"
] }
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

# -----------------------------------------------------------------------------
# Configuration - YAML + Environment Variables
# -----------------------------------------------------------------------------
config = "0.14"
serde_yaml = "0.9"

# -----------------------------------------------------------------------------
# Time - Timestamps & Duration
# -----------------------------------------------------------------------------
chrono = { version = "0.4", features = ["serde"] }

# -----------------------------------------------------------------------------
# Utilities
# -----------------------------------------------------------------------------
bytes = "1.5"
uuid = { version = "1.6", features = ["v4", "serde"] }
lazy_static = "1.4"
once_cell = "1.19"
url = "2.5"                      # URL parsing for Redis configuration
rand = "0.9"                     # Random number generation for jitter

# -----------------------------------------------------------------------------
# Flight-Recorder Recording (Optional) - integration hook
# Wired to the sibling `blackbox` flight-recorder crate in this repo. The
# `blackbox` feature (off by default) turns on the tap points in orderbook/
# connector/manager to record events for deterministic replay. Off by default
# so the core build stays standalone (no cross-component dep unless opted in).
# -----------------------------------------------------------------------------
flight-recorder = { path = "../blackbox/crates/blackbox", package = "blackbox", optional = true }

# =============================================================================
# DEV DEPENDENCIES - Testing & Benchmarking
# =============================================================================

[dev-dependencies]
# Benchmarking
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

# Profiling
dhat = "0.3"                 # Heap profiler for allocation analysis

# Testing
tokio-test = "0.4"
mockall = "0.12"             # Mocking framework
proptest = "1.4"             # Property-based testing
test-case = "3.3"            # Parameterized tests
serial_test = "3.0"          # Serial test execution for env var tests

# Utilities
tempfile = "3.9"             # Temporary files for tests
pretty_assertions = "1.4"    # Better assertion output
rust_decimal_macros = "1.33" # Decimal macros for tests

